<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE KINETIC TYPO - Lyrical 3D</title>
    <style>
        body {
            background-color: #121216;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0; padding: 40px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 80%; max-width: 800px; }
        h1 { color: #ff3366; font-size: 24px; text-transform: uppercase; letter-spacing: 2px;}
        .panel {
            background-color: #1e1e24;
            padding: 20px; border-radius: 8px; margin-bottom: 20px;
            border: 1px solid #333;
        }
        label { display: block; margin-bottom: 10px; color: #888; font-size: 14px; }
        textarea {
            width: 100%; height: 200px;
            background-color: #000; color: #fff;
            border: 1px solid #444; padding: 10px; border-radius: 4px;
            font-family: 'Malgun Gothic', sans-serif; font-size: 16px;
            box-sizing: border-box; resize: vertical;
        }
        .btn {
            background-color: #ff3366; color: white;
            border: none; padding: 15px 30px; font-size: 16px; font-weight: bold;
            border-radius: 4px; cursor: pointer; width: 100%;
            transition: background-color 0.3s;
        }
        .btn:hover { background-color: #ff1a53; }
    </style>
</head>
<body>

<div class="container">
    <h1>AE KINETIC TYPO (Lyrical 3D Ver)</h1>
    
    <div class="panel">
        <label>가사 입력 (한 줄에 하나의 자막 레이어로 생성됩니다)</label>
        <textarea id="lyricsInput" placeholder="바람은 불어도&#10;눈보라 쳐도&#10;나는 간다"></textarea>
    </div>

    <button class="btn" onclick="generateJSX()">⭐ JSX 스크립트 생성 ⭐</button>
</div>

    if(!lyricsText.trim()) {
        alert("가사를 입력해주세요!");
        return;
    }
